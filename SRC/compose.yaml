name: curator-pd

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    ports:
      - "27101:8000"

    volumes:
      - ./backend:/app
      - ./data:/data

    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/database.db
      PYTHONUNBUFFERED: "1"

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    ports:
      - "27100:5173"

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

    environment:
      VITE_API_URL: http://localhost:27101/api
      VITE_WS_URL: ws://localhost:27101/api/ws/

    depends_on:
      - backend

    restart: unless-stopped

volumes:
  frontend_node_modules:
